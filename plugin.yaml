name: hermes-browser
label: Unfold
kind: platform
version: 0.6.0
description: Authenticated Unfold connector with skills, media, and optional phone transfers.
author: Peggy
optional_env:
  - name: HERMES_BROWSER_CONNECTOR_TOKEN
    description: Browser pairing token
    prompt: Pairing token
    secret: true
  - name: HERMES_BROWSER_CONNECTOR_PORT
    description: Loopback WebSocket port
    prompt: Connector port
    secret: false
  - name: HERMES_BROWSER_MOBILE_PORT
    description: Temporary phone upload port
    prompt: Mobile transfer port
    secret: false
  - name: HERMES_BROWSER_MOBILE_HOST
    description: Optional LAN address advertised in phone QR codes
    prompt: Mobile transfer host
    secret: false
